x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  # Route the "java" queue to the Java SDK coordinator (AIP-85).
  AIRFLOW__SDK__COORDINATORS: '{"java": {"classpath": "airflow.sdk.coordinators.java.JavaCoordinator"}}'
  AIRFLOW__SDK__QUEUE_TO_COORDINATOR: '{"java": "java"}'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    image: airflow-java-dag-demo:local
    command: standalone
    environment: *airflow-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
